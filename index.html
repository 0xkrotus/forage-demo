<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forage: the open market for AI tools</title>
<link rel="icon" href="brand/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=Geist+Mono:wght@400;500&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg:#FFFEFB; --ink:#111111; --body:#374151; --muted:#6B7280; --line:#E5E3DD; --card:rgba(255,255,255,.94);
    --forage:#6D28D9; --supplier:#0B5563; --buyer:#C2410C; --app:#4B5563;
    --display:"Oxanium", "Arimo", Helvetica, Arial, sans-serif; --text:"Arimo", "Inter", "Helvetica Neue", Arial, sans-serif; --mono:"Geist Mono", Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body { color:var(--body); font:15px/1.5 var(--text); -webkit-font-smoothing:antialiased; background:var(--bg); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 16px 40px -28px rgba(17,17,17,.35); }
  .hide { display:none !important; }
  /* Numbered step chip, as on Antseed's "You're 3 steps from" cards: a mono number in a small rounded square. */
  .chip { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:5px; background:var(--ink); color:#fff; font:500 11px var(--mono); flex:0 0 auto; }

  /* The 3D world fills the window. Everything else floats over it as cards. */
  .map { position:fixed; inset:0; z-index:0; }
  .map canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  .map canvas:active { cursor:grabbing; }
  .map.hover canvas { cursor:pointer; }
  #labels { position:absolute; inset:0; pointer-events:none; }
  .lbl { position:absolute; left:0; top:0; display:grid; grid-template-columns:auto auto; align-items:baseline; gap:1px 9px; padding:5px 10px 4px; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 24px -16px rgba(17,17,17,.35); white-space:nowrap; line-height:1.2; will-change:transform; font-family:var(--text); }
  .lbl b { font-size:11px; font-weight:700; color:var(--c); }
  .lbl .bal { display:inline-block; font:500 11px var(--mono); color:var(--ink); font-variant-numeric:tabular-nums; }
  .lbl .desc small { display:block; font:500 9px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .lbl .role { grid-column:1 / -1; font:400 8px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .lbl .delta { position:absolute; left:50%; top:100%; transform:translate(-50%, 5px); font:500 11px var(--mono); color:var(--c); opacity:0; transition:opacity .35s; font-variant-numeric:tabular-nums; }
  .lbl .delta.show { opacity:1; }
  .lbl .desc { display:none; position:absolute; left:50%; top:100%; transform:translate(-50%, 8px); font:13px/1.45 var(--text); color:var(--body); background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 12px; white-space:normal; width:230px; text-align:left; box-shadow:0 16px 32px -14px rgba(17,17,17,.3); }
  .lbl.hot .desc { display:block; }
  .lbl.hot .delta { opacity:0; }
  .lbl.land .bal { animation:land .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes land { 0% { transform:scale(1); } 35% { transform:scale(1.4); } 100% { transform:scale(1); } }
  /* Pills that ride on moving things: the request packet, the result, the coins, the signed total, the tokens. */
  .tag3 { position:absolute; left:0; top:0; padding:4px 9px; border-radius:7px; background:var(--card); border:1px solid var(--line); box-shadow:0 8px 20px -12px rgba(17,17,17,.4); font:400 11px var(--text); color:var(--c, var(--ink)); white-space:nowrap; max-width:250px; overflow:hidden; text-overflow:ellipsis; will-change:transform; }
  .tag3.sig { padding:7px 14px; border-radius:10px; text-align:center; line-height:1.25; }
  .tag3.sig b { display:block; font:500 9px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--forage); }
  .tag3.sig .amt { display:block; font:600 22px/1.1 var(--display); color:var(--ink); font-variant-numeric:tabular-nums; margin-top:2px; }
  .tag3.sig small { display:block; font:400 10px var(--mono); color:var(--muted); }
  .tag3.dim { color:var(--muted); }
  /* Station markers on the trail, payee pads at the fork, and the column names in the bigger picture. */
  .mk { position:absolute; left:0; top:0; display:flex; align-items:center; gap:6px; font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap; will-change:transform; transition:color .4s; }
  .mk .n { width:18px; height:18px; border-radius:5px; border:1px solid var(--line); display:grid; place-items:center; font-size:10px; letter-spacing:0; background:#fff; color:var(--ink); transition:background .4s, color .4s, box-shadow .4s, border-color .4s; }
  .mk.done { color:var(--ink); } .mk.done .n { background:var(--ink); color:#fff; border-color:var(--ink); }
  .mk.on { color:var(--forage); } .mk.on .n { background:var(--forage); color:#fff; border-color:var(--forage); box-shadow:0 0 0 4px rgba(109,40,217,.14); }
  .mk.pad { color:var(--c); background:rgba(255,254,251,.92); padding:3px 8px 3px 7px; border-radius:7px; box-shadow:0 6px 16px -10px rgba(17,17,17,.4); } .mk.pad::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--c); }
  .mk.col { color:var(--ink); font-size:10px; padding:3px 8px; border-radius:6px; background:var(--card); border:1px solid var(--line); }
  /* No WebGL: the party pills become a plain grid; the story still steps through. */
  .map.nogl { overflow:auto; padding:90px 20px 300px; }
  .map.nogl canvas { display:none; }
  .map.nogl #labels { position:static; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .map.nogl .lbl { position:static; transform:none !important; display:block; border-radius:10px; white-space:normal; }
  .map.nogl .lbl b, .map.nogl .lbl .bal { display:block; }
  .map.nogl .lbl .desc, .map.nogl .lbl .delta { display:block; position:static; transform:none; opacity:1; width:auto; box-shadow:none; border:0; padding:4px 0 0; background:none; }
  .map.nogl .mk, .map.nogl .tag3 { display:none; }

  /* Brand lockup, top left, always: the forked-root mark and the FORAGE wordmark. */
  .brand { position:fixed; top:20px; left:28px; z-index:3; display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink); font:700 21px/1 "Arimo", Helvetica, Arial, sans-serif; letter-spacing:-.05em; }
  .brand svg { width:28px; height:28px; }

  /* One compact text block per chapter. */
  .story { position:fixed; left:28px; top:50%; transform:translateY(-50%); z-index:2; width:min(430px, 34vw); padding:22px 24px; transition:opacity .35s ease, transform .35s ease; }
  .story.out { opacity:0; transform:translateY(calc(-50% + 14px)); }
  .eyebrow { display:flex; align-items:center; gap:9px; font:500 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .eyebrow .chip[hidden] { display:none; }
  .story h1 { margin:12px 0 0; font:600 27px/1.15 var(--display); color:var(--ink); letter-spacing:-.01em; }
  .story h1 i { font-style:normal; color:var(--forage); }
  .story .body { margin:10px 0 0; font-size:15px; }
  .story ul { margin:0; padding:0; list-style:none; }
  .story li { padding:8px 0; border-top:1px solid var(--line); color:var(--ink); }
  .story li b { font:600 19px/1 var(--display); color:var(--forage); }
  .story .act { display:flex; align-items:center; gap:8px; margin:12px 0 0; font:700 13px var(--text); color:var(--forage); }
  .story .act::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--forage); animation:beat 1.4s ease-in-out infinite; flex:0 0 auto; }
  .story .act.warn { color:var(--buyer); } .story .act.warn::before { background:var(--buyer); }
  .story .act:empty { display:none; }
  .story .note { margin:10px 0 0; font:500 9px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .story .note:empty { display:none; }
  @keyframes beat { 0%,100% { transform:scale(.7); opacity:.5; } 50% { transform:scale(1.15); opacity:1; } }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  button, .btn { font:700 13px var(--text); border-radius:8px; padding:10px 16px; cursor:pointer; color:var(--ink); border:1px solid var(--line); background:#fff; transition:transform .2s, border-color .2s, background .2s; text-decoration:none; line-height:1.2; }
  button:hover:not(:disabled), .btn:hover { transform:translateY(-1px); border-color:#C9C5BC; }
  #cta { background:var(--ink); color:#fff; border-color:var(--ink); }
  #cta:hover:not(:disabled) { background:var(--forage); border-color:var(--forage); }
  .controls .sm { padding:9px 12px; font-weight:400; }
  button:disabled { opacity:.4; cursor:default; }
  [hidden] { display:none !important; }

  /* Chapter navigator on the right edge: dots with short labels, current one lit. */
  .nav { position:fixed; right:18px; top:50%; transform:translateY(-50%); z-index:3; display:flex; flex-direction:column; gap:12px; align-items:flex-end; padding:14px 12px 14px 16px; border-radius:14px; background:rgba(255,254,251,.78); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(17,17,17,.06); box-shadow:0 10px 30px -18px rgba(17,17,17,.35); }
  .nav button { display:flex; align-items:center; gap:10px; padding:4px 0; border:0; background:none; box-shadow:none; font:500 10px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); opacity:.85; transform:none !important; border-radius:0; }
  .nav button .d { width:8px; height:8px; border-radius:50%; border:1px solid #B5B1A8; background:#fff; flex:0 0 auto; transition:transform .3s, box-shadow .3s, background .3s; }
  .nav button.done { color:var(--ink); } .nav button.done .d { background:var(--ink); border-color:var(--ink); }
  .nav button.on { color:var(--forage); opacity:1; } .nav button.on .d { background:var(--forage); border-color:var(--forage); transform:scale(1.4); box-shadow:0 0 0 4px rgba(109,40,217,.14); }
  .nav button:hover { opacity:1; }

  /* The split bar: only once the lever has been pulled. */
  .split { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); width:min(700px, 56vw); z-index:2; padding:16px 18px; opacity:0; pointer-events:none; transition:opacity .6s; perspective:900px; }
  .split.show { opacity:1; pointer-events:auto; }
  .split .eyebrow { margin-bottom:12px; }
  .splitbar { display:flex; height:40px; border-radius:8px; overflow:hidden; font:700 13px var(--text); color:#fff; transform-origin:bottom; }
  .splitbar div { display:flex; align-items:center; padding:0 14px; white-space:nowrap; overflow:hidden; }
  .split.show .splitbar { animation:rise .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { transform:rotateX(70deg); opacity:0; } to { transform:rotateX(0); opacity:1; } }
  .legend { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-top:12px; font-size:13px; }
  .legend b { display:block; font:600 19px/1.1 var(--display); font-variant-numeric:tabular-nums; }

  footer { position:fixed; left:28px; bottom:14px; z-index:2; font:400 11px var(--mono); color:var(--muted); max-width:min(430px, 34vw); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  footer a { color:var(--muted); }

  @media (max-width:800px) {
    .brand { top:14px; left:16px; font-size:17px; } .brand svg { width:22px; height:22px; }
    .story { left:12px; right:12px; top:auto; bottom:52px; transform:none; width:auto; padding:14px 16px; }
    .story.out { transform:translateY(14px); }
    .story h1 { font-size:21px; } .story .body, .story li { font-size:13px; } .story li b { font-size:16px; }
    .controls { margin-top:12px; } button, .btn { padding:9px 12px; font-size:12px; }
    .nav { right:auto; left:50%; top:auto; bottom:14px; transform:translateX(-50%); flex-direction:row; gap:9px; align-items:center; }
    .nav button span { display:none; }
    .split { top:56px; bottom:auto; left:12px; right:12px; width:auto; transform:none; padding:12px; }
    .legend { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; font-size:12px; } .legend b { font-size:16px; }
    footer { display:none; }
    .lbl { padding:3px 8px; gap:0 6px; } .lbl b { font-size:10px; } .lbl .bal { font-size:10px; } .lbl .role { display:none; } .lbl .delta { font-size:10px; }
    .lbl .desc { display:none !important; }
    .tag3 { font-size:9px; padding:3px 7px; max-width:150px; } .tag3.sig .amt { font-size:16px; } .tag3.sig small { display:none; }
    .mk { font-size:8px; gap:4px; } .mk .n { width:14px; height:14px; font-size:8px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .story, .split, .nav button .d, .lbl .delta { transition:none; }
    .story.out { transform:translateY(-50%); }
    .story .act::before, .lbl.land .bal, .split.show .splitbar { animation:none; }
  }
</style>
</head>
<body>
<main>
  <div class="map" id="map" role="img" aria-label="A money tree in the middle, and a trail around it from Mia's agent and the Scout app, past the Forage vault, SearchCo and the signpost, to the tree's base, where one settlement drops three coins">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
  </div>

  <a class="brand" href="#" aria-label="Forage"><svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" aria-hidden="true"><path d="M50 94 V58 C50 40 60 28 76 16" stroke="#111" stroke-width="13"/><path d="M50 66 C46 50 36 40 22 34" stroke="#6D28D9" stroke-width="5"/><path d="M50 60 C48 44 46 30 40 14" stroke="#4B5563" stroke-width="5"/></svg>FORAGE</a>

  <section class="story card" id="story" aria-live="polite">
    <div class="eyebrow"><span class="chip" id="capNum">1</span><span id="capEyebrow"></span></div>
    <h1 id="capTitle"></h1>
    <div class="body" id="capBody"></div>
    <p class="act" id="act"></p>
    <p class="note" id="note"></p>
    <div class="controls">
      <button id="cta"></button>
      <!-- TODO: point this at mailto:<contact address> before shipping. -->
      <a class="btn" id="talk" href="#" hidden>Talk to us</a>
      <button class="sm" id="prev">Prev</button>
      <button class="sm" id="next">Next</button>
      <button class="sm" id="watch">Watch the story</button>
    </div>
  </section>

  <nav class="nav" id="nav" aria-label="Chapters"></nav>

  <section class="split card" id="split">
    <div class="eyebrow"><span class="chip">5</span><span>The split of $0.0579</span></div>
    <div class="splitbar">
      <div style="flex:91;background:var(--supplier)">SearchCo 91%</div>
      <div style="flex:4;background:var(--forage)"></div>
      <div style="flex:5;background:var(--app)"></div>
    </div>
    <div class="legend">
      <div style="color:var(--supplier)"><b id="lgS"></b>SearchCo keeps 91%</div>
      <div style="color:var(--forage)"><b id="lgF"></b>Forage fee, 4%</div>
      <div style="color:var(--app)"><b id="lgA"></b>Scout, 5% for bringing Mia</div>
      <div style="color:var(--ink)"><b id="lgV"></b>Stays in Mia's vault</div>
    </div>
  </section>

  <footer>Simulated. Amounts in USDC with 6 decimals, as on Base. Names are illustrative. Per-call prices from treg.to's public catalog, Oct 2026. 3D models: <a href="assets/CREDITS.md" target="_blank" rel="noopener">credits</a>.</footer>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// Money in micro-USDC (6 decimals), like the real token, so the split has no float dust.
const FEE_BPS = 400, APP_BPS = 500;  // Forage 4%, Scout 5%, SearchCo keeps the rest
const DEPOSIT = 1000000;             // $1.00
const COIN = 200000;                 // one coin in the vault's small row is $0.20
const INK = 0x111111, PURPLE = 0x6D28D9, GREY = 0x4B5563, BG = 0xFFFEFB;

// Mia's agent has picked Supplier B for a 10,000-unit order and now needs the right person there.
// Task, result, price in micro-USDC. Prices are per-call prices from treg.to's public people-search catalog, Oct 2026.
const SEARCHES = [
  ["Search for procurement leads at Supplier B", "6 people found", 10000],
  ["Match the top lead to a work profile", "Head of Procurement, 9 years in role", 26000],
  ["Find her work email", "1 address found", 8900],
  ["Verify the email", "Deliverable, verified", 3000],
  ["Enrich Supplier B's company profile", "1,200 staff, 3 plants, ISO 9001", 10000],
];

// The money tree (the Forage mark) stands in the middle. The trail loops around it: Start and Fund on the left,
// behind the tree, Call and Sign on the right, back to the tree's base where it forks into the three payee pads.
// pos is where a party stands on the ground; h is its height, used for label and flight anchors (models overwrite it when they load).
const NODES = {
  mia:      { pos:[-7.2, 0, 0.6],  color:0xC2410C, css:"var(--buyer)",    name:"Mia's agent",  role:"Buyer", h:1.5,
              desc:"Holds one USDC balance in the vault. Signs a running total owed to SearchCo instead of paying per call." },
  scout:    { pos:[-5.8, 0, -1.2], color:GREY,     css:"var(--app)",      name:"Scout app",    role:"The app Mia uses", h:1.2, lab:2.5,
              desc:"Mia runs her agent inside Scout. Scout routes each call and earns 5% of every settlement for bringing her." },
  vault:    { pos:[-3.7, 0, -0.5], color:INK,      css:"var(--ink)",      name:"Forage vault", role:"Mia's locked balance", h:1.5,
              desc:"One balance on Base that pays for any tool on Forage. Mia can withdraw what she does not spend." },
  searchco: { pos:[3.6, 0, -1.3],  color:0x0B5563, css:"var(--supplier)", name:"SearchCo",     role:"AI company, sells search", h:2.0,
              desc:"Serves the search and keeps 91%. Cashes in Mia's latest signature whenever it likes." },
  forage:   { pos:[0, 0, 0.3],     color:PURPLE,   css:"var(--forage)",   name:"Forage",       role:"Protocol", h:3.9,
              desc:"Takes a 4% fee on each settlement. Proposed: mints $FORAGE weekly on recognized usage." },
};
const SIGN_AT = [5.0, 0, 0.9];   // station 4: the signpost
const FORK = NODES.forage.pos;   // station 5: the tree's base, where the trail forks toward the viewer, like the mark
const TREE_S = 4.0;              // height of the tree's 100-box; the fork on the ground is the same mark laid flat
// Tools an agent needs today, each a dead end behind its own lock. Monthly plan prices are illustrative.
const TOOLS = [["Search", 49, [-5.0, -3.4]], ["Email finder", 29, [-4.6, 3.2]], ["Maps", 20, [-2.2, -4.0]],
               ["Voice", 39, [-2.8, 4.0]], ["Vision", 59, [1.8, -3.4]], ["Data", 25, [2.8, 3.2]]];

function split(total) {
  const forage = total * FEE_BPS / 10000;
  const app = total * APP_BPS / 10000;
  const supplier = total - forage - app;
  console.assert(supplier + forage + app === total && Number.isInteger(forage + app), "split must add up");
  return { supplier, forage, app };
}

// Four decimals for anything under ten cents or not a whole cent, so a $0.0030 call never shows as $0.00.
const usd = u => "$" + (u / 1e6).toFixed(u % 10000 || (u > 0 && u < 100000) ? 4 : 2);
const $ = id => document.getElementById(id);
const BASE_PACE = 1.6, PLAY_PACE = 2.3; // every flight, camera move and pause is stretched by pace
let pace = BASE_PACE; // BASE_PACE when the viewer drives, PLAY_PACE during Watch the story
// Chase camera: while something flies, the camera closes in on it; after it lands the chapter shot returns.
let chase = null, lastShot = null;
let quick = false; // catching up state for a chapter the viewer jumped to: no flights, no waits
const sleep = ms => new Promise(r => setTimeout(r, ms * pace));
const hold = ms => new Promise(r => setTimeout(r, ms));
const wait = ms => sleep(reduced || quick ? 0 : ms);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const small = matchMedia("(max-width: 800px)").matches;
const map = $("map"), labelsEl = $("labels"), canvas = $("scene"), story = $("story");
// Headline copy marks its purple word with *stars*.
const em = t => t.replace(/\*(.+?)\*/g, "<i>$1</i>");
const text = t => typeof t === "function" ? t() : t;

// The chapters. step is the station number on the trail. hold is how long Watch the story rests on one (real ms, not paced).
const CH = [
  { label:"Forage",  eye:"Forage",             title:"The *open* market for AI tools.",
    body:"An agent buys any tool from one balance. Every settlement pays the AI company, Forage, and the app that brought the buyer. Five steps around the tree.", cta:"See how it works", hold:5000 },
  { label:"Problem", eye:"The problem",        title:"Every tool is a *dead end*.",
    body:"An agent that needs search, email and maps today needs three signups, three API keys and three monthly plans. The app that brought the user earns nothing.", hold:6500 },
  { label:"Picture", eye:"The bigger picture", title:"One trail *settles* them all.",
    body:"Many agents, many apps, many AI companies. Forage holds one balance per buyer and routes every call's payment through it.", hold:7000 },
  { label:"Start",   eye:"Start", step:1,      title:"Mia's agent and the *Scout* app.",
    body:"Mia's agent must source a supplier and needs five people searches. Scout is the app Mia uses: it routes her calls and earns 5% of each settlement for bringing her.", hold:5500 },
  { label:"Fund",    eye:"Fund", step:2,       title:"Mia funds her agent *once*.",

  drawBoard();
  const c = CH[ch];
  if (!story.classList.contains("out")) { if (typeof c.body === "function") $("capBody").textContent = c.body(); if (typeof c.title === "function") $("capTitle").innerHTML = em(c.title()); }
  const act = $("act"); act.classList.remove("warn"); act.textContent = busy ? "" : action();
  // Touch: block page scroll only on chapters where a finger drags something in the scene.
  if (gl) canvas.style.touchAction = target() === "mia" || target() === "lever" ? "none" : "pan-y";
  $("prev").disabled = busy || ch === 0; $("next").disabled = busy || ch === CH.length - 1; $("cta").disabled = busy;
  $("watch").textContent = playing ? "Stop" : "Watch the story";
  $("watch").disabled = busy && !playing;
  navEl.querySelectorAll("button").forEach((b, i) => { b.className = i < ch ? "done" : i === ch ? "on" : ""; b.setAttribute("aria-current", i === ch ? "step" : "false"); });

  for (const [k, n] of Object.entries(nodeEls)) {
    n.bal.textContent = usd(s.bal[k]);
    const d = s.delta[k];
    clearTimeout(n.timer);
    if (d) { n.delta.textContent = (d > 0 ? "+" : "-") + usd(Math.abs(d)); n.delta.classList.add("show"); n.timer = setTimeout(() => n.delta.classList.remove("show"), 2800); }
    else n.delta.classList.remove("show");
  }
  render3d();

  const showSplit = ch === 7 && s.step === 3;
  if (showSplit) {
    const p = split(s.total);
    $("lgS").textContent = usd(p.supplier); $("lgF").textContent = usd(p.forage); $("lgA").textContent = usd(p.app); $("lgV").textContent = usd(s.bal.vault);
  }
  $("split").classList.toggle("show", showSplit);
}

// Navigator: one dot per chapter, keyboard arrows, wheel, swipe, prev and next.
const navEl = $("nav");
CH.forEach((c, i) => {
  const b = document.createElement("button"); b.type = "button";
  b.innerHTML = `<span>${c.label}</span><i class="d"></i>`; b.setAttribute("aria-label", `Chapter ${i + 1}: ${c.label}`);
  b.addEventListener("click", () => { stopWatch(); goTo(i); b.blur(); });
  navEl.appendChild(b);
});
$("prev").addEventListener("click", () => { stopWatch(); goTo(ch - 1); });
$("next").addEventListener("click", () => { stopWatch(); goTo(ch + 1); });
$("cta").addEventListener("click", () => { if (ch === 0) { stopWatch(); goTo(1); } else replay(); });
$("watch").addEventListener("click", watch);
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); stopWatch(); goTo(ch + 1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); stopWatch(); goTo(ch - 1); }
  else if (e.key === "Home") { stopWatch(); goTo(0); }
  else if (e.key === "End") { stopWatch(); goTo(CH.length - 1); }
});
let wheelAcc = 0, wheelAt = 0, wheelTurn = 0;
addEventListener("wheel", e => {
  const now = performance.now();
  if (now - wheelAt > 300) wheelAcc = 0;
  wheelAt = now; wheelAcc += e.deltaY;
  if (now - wheelTurn > 900 && Math.abs(wheelAcc) > 60) { wheelTurn = now; stopWatch(); goTo(ch + Math.sign(wheelAcc)); wheelAcc = 0; }
}, { passive:true });

reset();
show(0, true);
</script>
</body>
</html>
